# Codemagic CI/CD — Fashion OS Flutter app (CLAUDE.md §21).
# The app lives in app/; generated files (*.freezed.dart, *.g.dart,
# app_localizations*) are regenerated here, so every workflow runs codegen before
# analyze/test/build. Set secrets (keystore, Play key) as Codemagic env groups.

definitions:
  scripts:
    - &prepare
      name: Get deps + codegen
      script: |
        cd app
        flutter --version
        flutter pub get
        flutter gen-l10n
        dart run build_runner build --delete-conflicting-outputs
    - &verify
      name: Analyze + test
      script: |
        cd app
        flutter analyze
        flutter test
    - &write_prod_env
      name: Write prod dart-define (app/env/prod.json) from app_prod_config
      script: |
        set -euo pipefail
        # Fail fast if the required PUBLIC client config isn't set in the group.
        : "${API_BASE_URL:?set API_BASE_URL in the app_prod_config env group}"
        : "${SUPABASE_URL:?set SUPABASE_URL in the app_prod_config env group}"
        : "${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in the app_prod_config env group}"
        # Feature gates are REQUIRED, not defaulted. Local-first background removal
        # shipped ON for Android in 1.0.16+19 (Play production, 2026-07-29). While
        # these defaulted to "false" here, a CI-built release would have silently
        # REGRESSED that — reverting every user to the Azure BiRefNet path with no
        # failing step and no diff to notice. State the intent explicitly instead.
        : "${LOCAL_BG_REMOVAL_ENABLED:?set LOCAL_BG_REMOVAL_ENABLED (true|false) in the app_prod_config env group}"
        : "${LOCAL_BG_ANDROID_ENABLED:?set LOCAL_BG_ANDROID_ENABLED (true|false) in the app_prod_config env group}"
        : "${LOCAL_BG_IOS_ENABLED:?set LOCAL_BG_IOS_ENABLED (true|false) in the app_prod_config env group}"
        # A gate value must be the EXACT string "true" or "false". Dart's
        # bool.fromEnvironment only reads "true" as true, so "True", "1", "yes" or a
        # stray space all compile to FALSE — the same silent-off failure the lines
        # above prevent, just via a typo instead of an omission. Refuse to build.
        CUTOUT_EDITOR_ENABLED="${CUTOUT_EDITOR_ENABLED:-true}"
        # Diagnostics are the ONE gate that defaults instead of being required, and
        # deliberately so. The gates above are required because their dangerous
        # accident is silently OFF — a release that quietly loses a shipped feature.
        # For an internal diagnostic switch the dangerous accident is the opposite:
        # silently ON in front of real users. So it defaults to false and only the
        # ios-internal-diagnostic workflow overrides it.
        LOCAL_BG_IOS_DIAGNOSTICS_ENABLED="${LOCAL_BG_IOS_DIAGNOSTICS_ENABLED:-false}"
        # "Improve edges" defaults off for the same reason: it is NOT shipped, and
        # its dangerous accident is silently ON. It calls a server endpoint whose own
        # gate (LOCAL_CUTOUT_IMPROVE_ENABLED) is also off, which answers 404 — so an
        # accidental ON is a visible button that reports "not found" to real users.
        # That exact pair happened in production. Enabling it means setting this in
        # app_prod_config AND flipping the backend flag; one without the other is the
        # broken state.
        LOCAL_CUTOUT_IMPROVE_ENABLED="${LOCAL_CUTOUT_IMPROVE_ENABLED:-false}"
        for gate in LOCAL_BG_REMOVAL_ENABLED LOCAL_BG_ANDROID_ENABLED \
                    LOCAL_BG_IOS_ENABLED CUTOUT_EDITOR_ENABLED \
                    LOCAL_CUTOUT_IMPROVE_ENABLED \
                    LOCAL_BG_IOS_DIAGNOSTICS_ENABLED; do
          case "${!gate}" in
            true|false) ;;
            *) echo "FATAL: $gate must be exactly 'true' or 'false', got '${!gate}'." >&2
               echo "       Dart treats every other value as FALSE, which would ship the" >&2
               echo "       feature off without failing this build. Fix app_prod_config." >&2
               exit 1 ;;
          esac
        done
        export CUTOUT_EDITOR_ENABLED
        export LOCAL_CUTOUT_IMPROVE_ENABLED
        export LOCAL_BG_IOS_DIAGNOSTICS_ENABLED
        mkdir -p app/env
        # Build the JSON with python so every value is correctly escaped (no
        # heredoc/quote traps) and optional keys get sane defaults. Matches
        # app/env/prod.json.example; missing optionals fall back to the Dart
        # String.fromEnvironment defaults anyway. REVENUECAT_IOS_KEY is inert on
        # Android builds and vice versa (store_config.dart picks per platform).
        # Feature gates belong here too: this step OVERWRITES app/env/prod.json,
        # so a gate left out of this dict silently compiles OFF in CI even when
        # it is set locally. That is what hid "Fix cutout" on iOS — the Android
        # APK is built on Windows where the flag was appended by hand, while
        # every iOS build comes through here.
        #
        # LOCAL_BG_* are the local-first background-removal gates (Apple Vision /
        # Google ML Kit). They are read with os.environ[...] — NO default — because
        # the required-check above already guarantees them, and a defaulted gate is
        # how a release silently regresses. Rollout stays a value change in the
        # app_prod_config env group with no edit to this file.
        # As of 1.0.16+19 production the intended group values are:
        #   LOCAL_BG_REMOVAL_ENABLED=true   LOCAL_BG_ANDROID_ENABLED=true
        #   LOCAL_BG_IOS_ENABLED=false      (iOS is still dormant — unverified on
        #                                    device, and 74 Swift XCTests never ran)
        python3 -c 'import json,os; json.dump({"ENVIRONMENT":"prod","API_BASE_URL":os.environ["API_BASE_URL"],"SUPABASE_URL":os.environ["SUPABASE_URL"],"SUPABASE_ANON_KEY":os.environ["SUPABASE_ANON_KEY"],"SENTRY_DSN":os.environ.get("SENTRY_DSN",""),"POSTHOG_API_KEY":os.environ.get("POSTHOG_API_KEY",""),"POSTHOG_HOST":os.environ.get("POSTHOG_HOST","https://us.i.posthog.com"),"GOOGLE_WEB_CLIENT_ID":os.environ.get("GOOGLE_WEB_CLIENT_ID",""),"REVENUECAT_ANDROID_KEY":os.environ.get("REVENUECAT_ANDROID_KEY",""),"REVENUECAT_IOS_KEY":os.environ.get("REVENUECAT_IOS_KEY",""),"REVENUECAT_ENTITLEMENT_ID":os.environ.get("REVENUECAT_ENTITLEMENT_ID","premium"),"CUTOUT_EDITOR_ENABLED":os.environ["CUTOUT_EDITOR_ENABLED"],"LOCAL_CUTOUT_IMPROVE_ENABLED":os.environ["LOCAL_CUTOUT_IMPROVE_ENABLED"],"LOCAL_BG_REMOVAL_ENABLED":os.environ["LOCAL_BG_REMOVAL_ENABLED"],"LOCAL_BG_ANDROID_ENABLED":os.environ["LOCAL_BG_ANDROID_ENABLED"],"LOCAL_BG_IOS_ENABLED":os.environ["LOCAL_BG_IOS_ENABLED"],"LOCAL_BG_IOS_DIAGNOSTICS_ENABLED":os.environ["LOCAL_BG_IOS_DIAGNOSTICS_ENABLED"]}, open("app/env/prod.json","w"), indent=2)'
        # Validate the JSON + log a SECRET-SAFE summary (values shown set/empty, never printed).
        # Feature gates print their LITERAL value: they are never secrets, and the
        # generic "set" would read as "on" for a gate whose value is the string
        # "false" — exactly the confusion to avoid during a staged rollout.
        python3 -c 'import json; d=json.load(open("app/env/prod.json")); assert d["API_BASE_URL"] and d["SUPABASE_URL"] and d["SUPABASE_ANON_KEY"], "missing required prod config"; bad={k:d[k] for k in ("CUTOUT_EDITOR_ENABLED","LOCAL_CUTOUT_IMPROVE_ENABLED","LOCAL_BG_REMOVAL_ENABLED","LOCAL_BG_ANDROID_ENABLED","LOCAL_BG_IOS_ENABLED","LOCAL_BG_IOS_DIAGNOSTICS_ENABLED") if d[k] not in ("true","false")}; assert not bad, f"gate(s) not a literal true/false in the GENERATED prod.json: {bad}"; print("env/prod.json:", {k:(v if k in ("ENVIRONMENT","API_BASE_URL","POSTHOG_HOST","REVENUECAT_ENTITLEMENT_ID","CUTOUT_EDITOR_ENABLED","LOCAL_BG_REMOVAL_ENABLED","LOCAL_BG_ANDROID_ENABLED","LOCAL_BG_IOS_ENABLED","LOCAL_BG_IOS_DIAGNOSTICS_ENABLED") else ("set" if v else "empty")) for k,v in d.items()})'

workflows:
  android:
    name: Android (build + test)
    # mac_mini_m2 = the free-tier machine (linux_x2 needs a paid plan and
    # fails instantly on the personal plan). Flutter Android builds run fine
    # on macOS runners.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android_signing # keystore creds (set in Codemagic): CM_KEYSTORE etc.
    # No automatic triggering — Android is built, signed, validated and
    # uploaded locally from Windows; Codemagic free minutes are reserved for
    # iOS. Start this workflow manually (Codemagic UI → Start new build, or
    # the API) when an Android CI run is wanted.
    scripts:
      - *prepare
      - *verify
      - name: Build debug APK (testable artifact)
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - uprightseo24@gmail.com

  android-release:
    name: Android release (signed AAB → Play)
    # Free-tier machine — see the android workflow note.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        # Upload your upload-keystore in Codemagic → Code signing identities,
        # name the reference `fashionos_upload`. Codemagic injects CM_KEYSTORE_PATH
        # / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD, which
        # android/app/build.gradle.kts reads for release signing (§22).
        - fashionos_upload
      groups:
        # Codemagic env group with the app's PUBLIC client config (§11 — anon key
        # only, never the service-role key). Required: API_BASE_URL
        # (=https://api.wearthemood.com), SUPABASE_URL, SUPABASE_ANON_KEY. Optional:
        # SENTRY_DSN, POSTHOG_API_KEY, POSTHOG_HOST, GOOGLE_WEB_CLIENT_ID,
        # REVENUECAT_ANDROID_KEY, REVENUECAT_ENTITLEMENT_ID (default "premium").
        - app_prod_config
    # No automatic triggering (was: v* tags) — Android releases are built,
    # signed and uploaded to Play locally from Windows. Start manually from
    # the Codemagic UI/API if a CI-built AAB is ever wanted.
    scripts:
      - *prepare
      - *verify
      - *write_prod_env
      - name: Build signed app bundle
        script: |
          cd app
          flutter build appbundle --release --dart-define-from-file=env/prod.json
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - uprightseo24@gmail.com
      # Wire Play publishing later: add a Google Play service account in Codemagic
      # and a `google_play:` block here (track: internal) to auto-upload the AAB.

  ios-compile-check:
    name: iOS compile check (monthly, no Mac/signing needed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *prepare
      - *verify
      - name: CI-only placeholder GoogleService-Info.plist (compile check only)
        script: |
          # The Xcode project bundles Runner/GoogleService-Info.plist (Firebase
          # iOS config, git-ignored). The REAL file is injected from a secure
          # variable in ios-release; this codesign-less compile check only needs
          # the file to EXIST (it's read at runtime, not compile time). This
          # placeholder must never ship — ios-release overwrites it or fails.
          if [ ! -f app/ios/Runner/GoogleService-Info.plist ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<plist version="1.0"><dict><key>CI_PLACEHOLDER</key><true/></dict></plist>' \
              > app/ios/Runner/GoogleService-Info.plist
          fi
      - name: Build iOS (no codesign) — surfaces platform issues early (§21)
        script: |
          cd app
          flutter build ios --release --no-codesign
    publishing:
      email:
        recipients:
          - uprightseo24@gmail.com

  # Previously this workflow failed before a single assertion with
  #   Cannot test target "RunnerTests" on "iPhone 17 Pro":
  #   RunnerTests does not support any of iPhone 17 Pro's architectures: arm64
  # and that was recorded as a Flutter-template limitation. Measurement on
  # 2026-07-30 disproved that: CocoaPods DOES supply a baseConfigurationReference
  # after pod install, and the target already resolved
  # SUPPORTED_PLATFORMS = "iphoneos iphonesimulator". The real cause was Google
  # ML Kit, which ships no arm64-simulator slice and propagates
  # EXCLUDED_ARCHS[sdk=iphonesimulator*] = arm64 into every user target. Clearing
  # that exclusion only moved the failure to `ld: framework 'Pods_Runner' not
  # found`, and the image offers no x86_64 simulator to fall back to (iOS 26.3 and
  # 26.4 runtimes are arm64-only), so an app-HOSTED test bundle cannot run here at
  # all. RunnerTests is therefore a standalone logic bundle: no test host, no
  # pods, no Flutter — see the RunnerTests scheme and app/ios/Podfile.
  ios-unit-tests:
    name: iOS unit tests (XCTest, no signing)
    # Runs the standalone RunnerTests bundle on a simulator — the only way to
    # execute the Swift tests for the local-cutout engine (local BG Phase 4),
    # since they need CoreVideo/CoreGraphics and a macOS toolchain.
    #
    # A SEPARATE workflow on purpose: adding an XCTest step to ios-compile-check
    # would put a new failure mode in front of every push to main. This one has no
    # `triggering` block, so it only ever runs when started by hand or by API.
    # It never signs, archives, publishes or uploads anything.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.1
    scripts:
      - *prepare
      - name: CI-only placeholder GoogleService-Info.plist (compile only)
        script: |
          # The Xcode project bundles Runner/GoogleService-Info.plist (git-ignored).
          # It is read at RUNTIME, so the tests only need the file to exist. This
          # placeholder must never ship — only ios-release supplies the real file.
          if [ ! -f app/ios/Runner/GoogleService-Info.plist ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<plist version="1.0"><dict><key>CI_PLACEHOLDER</key><true/></dict></plist>' \
              > app/ios/Runner/GoogleService-Info.plist
          fi
      - name: Resolve pods (needed for the Runner workspace)
        script: |
          set -euo pipefail
          cd app
          # Generates ios/Flutter/Generated.xcconfig + runs pod install.
          flutter build ios --config-only --no-codesign
      - name: Resolved RunnerTests build settings (diagnostic)
        # Prints what the RunnerTests target ACTUALLY resolves to for an arm64
        # simulator, so a configuration fix is measured rather than guessed. Never
        # fails the build: a diagnostic that can abort the run it is diagnosing is
        # worse than useless.
        script: |
          set +e
          cd app/ios
          echo "### Pods xcconfigs generated for the test target"
          ls -1 Pods/Target\ Support\ Files/Pods-RunnerTests/ 2>/dev/null \
            || echo "  (none — CocoaPods generated no Pods-RunnerTests support files)"
          echo
          echo "### baseConfigurationReference AFTER pod install"
          grep -n "baseConfigurationReference" Runner.xcodeproj/project.pbxproj
          echo
          echo "### arch lines INSIDE the generated Pods-RunnerTests xcconfigs"
          echo "### (this is where EXCLUDED_ARCHS[sdk=iphonesimulator*] = arm64 originates;"
          echo "###  the RunnerTests target overrides it to empty in project.pbxproj)"
          grep -Hn "ARCHS" Pods/Target\ Support\ Files/Pods-RunnerTests/*.xcconfig \
            || echo "  (no ARCHS lines in the Pods-RunnerTests xcconfigs)"
          echo
          echo "### RunnerTests, Debug, iphonesimulator — resolved settings"
          xcodebuild -showBuildSettings \
            -project Runner.xcodeproj \
            -target RunnerTests \
            -configuration Debug \
            -sdk iphonesimulator 2>&1 \
            | grep -E "^ +(SDKROOT|SUPPORTED_PLATFORMS|ARCHS|EXCLUDED_ARCHS|VALID_ARCHS|NATIVE_ARCH|PLATFORM_NAME|ONLY_ACTIVE_ARCH|TEST_HOST|BUNDLE_LOADER|PRODUCT_MODULE_NAME|PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|ENABLE_TESTABILITY|FRAMEWORK_SEARCH_PATHS|SWIFT_INCLUDE_PATHS|OTHER_SWIFT_FLAGS|SWIFT_VERSION) =" \
            || echo "  (-showBuildSettings failed — see raw output below)"
          echo
          echo "### Runner (host app) — the arch/platform baseline to match"
          xcodebuild -showBuildSettings \
            -project Runner.xcodeproj \
            -target Runner \
            -configuration Debug \
            -sdk iphonesimulator 2>&1 \
            | grep -E "^ +(SDKROOT|SUPPORTED_PLATFORMS|ARCHS|EXCLUDED_ARCHS|PRODUCT_MODULE_NAME|IPHONEOS_DEPLOYMENT_TARGET|ENABLE_TESTABILITY) ="
          echo
          echo "### Simulators this image offers"
          xcrun simctl list devices available | grep -i iphone | head -10
          set -e
      - name: Run RunnerTests on a simulator
        script: |
          set -euo pipefail
          cd app/ios
          # Pick whatever iPhone simulator this image actually has, rather than
          # pinning a name that a future Xcode image may drop.
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
              print(next(x["udid"] for runtime in d for x in d[runtime] if "iPhone" in x["name"]))')
          echo "Using simulator udid: $DEVICE"
          # Deliberately NOT piped through xcpretty: it is not guaranteed on the
          # build image, and a missing formatter breaks the pipe under `pipefail`,
          # truncating the log mid-run and hiding the real result. Capture stdout
          # AND stderr, then read xcodebuild's own exit status out of PIPESTATUS.
          set +e
          # -project, not -workspace, and the RunnerTests scheme, not Runner: the
          # bundle links no pods, so the CocoaPods workspace is irrelevant to it and
          # the Runner scheme would drag in the app (and ML Kit, which has no
          # arm64-simulator slice) for no reason.
          xcodebuild test \
            -project Runner.xcodeproj \
            -scheme RunnerTests \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ../../xcodebuild-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "--- test suite summary ---"
          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test" \
            ../../xcodebuild-test.log | tail -30 || true
          echo "--- per-test failures with assertion messages ---"
          # Sequential execution puts the assertion text inline; parallel clone
          # output carries only pass/fail, which is useless for diagnosis.
          grep -E "^.*\.swift:[0-9]+: error:|XCTAssert.* failed" \
            ../../xcodebuild-test.log | head -60 || true
          if [ "$STATUS" -ne 0 ]; then
            echo "--- xcodebuild test FAILED (exit $STATUS); failures + errors ---" >&2
            grep -E "error:|\*\* TEST|failed \(|XCTAssert" \
              ../../xcodebuild-test.log | head -60 >&2 || true
            exit "$STATUS"
          fi
    artifacts:
      - xcodebuild-test.log
    publishing:
      email:
        recipients:
          - uprightseo24@gmail.com

  ios-release:
    name: iOS release (signed IPA → TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # The App Store Connect API key integration. Create it in Codemagic →
      # Teams → Integrations → App Store Connect with EXACTLY this name (upload
      # the .p8 there — never commit it). Used for signing-file fetch, the
      # TestFlight build-number lookup, and the TestFlight upload.
      app_store_connect: wtm_app_store_connect
    environment:
      # Pin the Flutter the repo was validated with (local dev is 3.44.1).
      flutter: 3.44.1
      # Automatic code signing: Codemagic fetches the uploaded Code signing
      # identities matching this distribution type + bundle id (the wtm_distribution
      # Apple Distribution certificate + the App Store provisioning profile for
      # com.wearthemood.app), authenticated via the wtm_app_store_connect
      # integration. `xcode-project use-profiles` (below) applies them.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wearthemood.app
      groups:
        # app_prod_config: same PUBLIC client config as android-release, plus
        # REVENUECAT_IOS_KEY (RevenueCat iOS app's PUBLIC SDK key).
        - app_prod_config
        # ios_config must define:
        #   GOOGLE_SERVICE_INFO_PLIST_B64 — base64 of the REAL iOS
        #     GoogleService-Info.plist from the Firebase console (secure var).
        #   APP_STORE_APP_ID (optional) — the numeric Apple app id; enables
        #     auto-incrementing the TestFlight build number.
        - ios_config
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "ios-v*" # e.g. push tag ios-v1.0.6 to cut an iOS build
          include: true
    scripts:
      - *prepare
      - *verify
      - *write_prod_env
      - name: Place the REAL GoogleService-Info.plist (required)
        script: |
          set -euo pipefail
          : "${GOOGLE_SERVICE_INFO_PLIST_B64:?Set GOOGLE_SERVICE_INFO_PLIST_B64 in the ios_config env group — base64 of the real iOS GoogleService-Info.plist downloaded from the Firebase console (iOS app com.wearthemood.app)}"
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > app/ios/Runner/GoogleService-Info.plist
          plutil -lint app/ios/Runner/GoogleService-Info.plist
          # Refuse to ship the CI placeholder by accident.
          if /usr/libexec/PlistBuddy -c "Print :CI_PLACEHOLDER" app/ios/Runner/GoogleService-Info.plist >/dev/null 2>&1; then
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 decodes to the CI placeholder — supply the real Firebase file." >&2
            exit 1
          fi
      - name: Register the Google reversed-client-id URL scheme (native sign-in)
        script: |
          set -euo pipefail
          PLIST=app/ios/Runner/Info.plist
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" app/ios/Runner/GoogleService-Info.plist)
          # Idempotent: append only when the scheme isn't registered yet.
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" | grep -q "$REVERSED_CLIENT_ID"; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleTypeRole string Editor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" "$PLIST"
          fi
          plutil -lint "$PLIST"
      # Applies the fetched Code signing identities (cert + App Store profile) to
      # the Xcode project and writes ~/export_options.plist for `flutter build ipa`.
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd app
          # Unique, increasing CFBundleVersion: continue from TestFlight when
          # APP_STORE_APP_ID is configured; otherwise pubspec's +buildNumber.
          BUILD_NUMBER_ARG=""
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)
            if [ -n "${LATEST:-}" ]; then
              BUILD_NUMBER_ARG="--build-number=$((LATEST + 1))"
              echo "Using TestFlight-derived build number: $((LATEST + 1))"
            fi
          fi
          flutter build ipa --release \
            --dart-define-from-file=env/prod.json \
            --export-options-plist=/Users/builder/export_options.plist \
            $BUILD_NUMBER_ARG
    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only — NEVER auto-submit to App Review from CI.
        #
        # PREREQUISITE, owner action, one time: `submit_to_testflight` submits to
        # TestFlight BETA REVIEW, and App Store Connect rejects that until the app's
        # Test Information is complete (App Store Connect → TestFlight → Test
        # Information: feedback email, and for external groups also a description +
        # review contact). Until it is filled in, this workflow builds and uploads a
        # perfectly good IPA and is then reported FAILED at the final step — observed
        # exactly that way on build 6a6b93b20d6ee1b365f19c19. The upload still lands,
        # so internal testers can install regardless; only the external submission
        # fails. Fill it in before relying on this workflow's exit status.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - uprightseo24@gmail.com

  # ⚠ INTERNAL DIAGNOSTIC BUILD (iOS Phase 3). Manual-only — no `triggering` block,
  # so it never fires on a push or a tag.
  #
  # This is the ONLY configuration in the repository that turns the iOS local
  # background-removal arm on, and the only one that compiles the diagnostic export
  # in at all. It exists to answer one question that no simulator, compile check or
  # unit test can: what does Apple Vision actually return on a physical iPhone.
  #
  # It does NOT touch app_prod_config. The gate values below are workflow-level
  # `vars`, which override the group for this workflow only, so a future production
  # build cannot inherit either the iOS arm or diagnostics. The assertion step
  # refuses to archive if the generated config is not exactly what is intended.
  ios-internal-diagnostic:
    name: iOS internal diagnostic (Apple Vision, TestFlight internal)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Reuse the EXISTING App Store Connect integration. Do not recreate it.
      app_store_connect: wtm_app_store_connect
    environment:
      flutter: 3.44.1
      # Reuse the EXISTING distribution certificate + App Store provisioning
      # profile for com.wearthemood.app.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wearthemood.app
      groups:
        - app_prod_config
        - ios_config
      vars:
        # Overrides for THIS workflow only. app_prod_config keeps
        # LOCAL_BG_IOS_ENABLED=false and defines no diagnostics flag at all.
        LOCAL_BG_REMOVAL_ENABLED: "true"
        LOCAL_BG_ANDROID_ENABLED: "true"
        LOCAL_BG_IOS_ENABLED: "true"
        LOCAL_BG_IOS_DIAGNOSTICS_ENABLED: "true"
    scripts:
      - *prepare
      - *verify
      - *write_prod_env
      - name: Assert this build really is the internal diagnostic configuration
        script: |
          set -euo pipefail
          # Fail BEFORE archiving. A diagnostic IPA with the iOS arm off would be a
          # wasted device session; worse, a build that quietly lacked the diagnostics
          # flag would produce a bundle-less run that looks like a Vision failure.
          python3 - <<'PY'
          import json, sys
          expected = {
              "LOCAL_BG_REMOVAL_ENABLED": "true",
              "LOCAL_BG_ANDROID_ENABLED": "true",
              "LOCAL_BG_IOS_ENABLED": "true",
              "LOCAL_BG_IOS_DIAGNOSTICS_ENABLED": "true",
              # Asserted OFF, not merely left to its default. The server's own
              # improve gate is off, so its endpoint answers 404 -- an ON here
              # puts an "Improve edges" button in front of the device tester that
              # can only ever report "not found", which is what happened on the
              # first diagnostic build when this affordance was gated on
              # LOCAL_BG_REMOVAL_ENABLED (forced true just above) instead of on
              # its own flag. A device session is too expensive to spend
              # debugging a button we already know is switched off.
              "LOCAL_CUTOUT_IMPROVE_ENABLED": "false",
          }
          config = json.load(open("app/env/prod.json"))
          wrong = {k: config.get(k) for k, v in expected.items() if config.get(k) != v}
          if wrong:
              print("FATAL: internal diagnostic build has the wrong gates.", file=sys.stderr)
              print(f"       expected {expected}", file=sys.stderr)
              print(f"       wrong    {wrong}", file=sys.stderr)
              sys.exit(1)
          print("internal diagnostic gates OK:", {k: config[k] for k in expected})
          PY
      - name: Place the REAL GoogleService-Info.plist (required)
        script: |
          set -euo pipefail
          : "${GOOGLE_SERVICE_INFO_PLIST_B64:?Set GOOGLE_SERVICE_INFO_PLIST_B64 in the ios_config env group}"
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > app/ios/Runner/GoogleService-Info.plist
          plutil -lint app/ios/Runner/GoogleService-Info.plist
          if /usr/libexec/PlistBuddy -c "Print :CI_PLACEHOLDER" app/ios/Runner/GoogleService-Info.plist >/dev/null 2>&1; then
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 decodes to the CI placeholder — supply the real Firebase file." >&2
            exit 1
          fi
      - name: Register the Google reversed-client-id URL scheme (native sign-in)
        script: |
          set -euo pipefail
          PLIST=app/ios/Runner/Info.plist
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" app/ios/Runner/GoogleService-Info.plist)
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" | grep -q "$REVERSED_CLIENT_ID"; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleTypeRole string Editor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" "$PLIST"
          fi
          plutil -lint "$PLIST"
      - name: Compile the native diagnostic export in (Swift condition)
        script: |
          set -euo pipefail
          # The Dart gate is a --dart-define and cannot reach Swift, so the native
          # share-sheet code sits behind `#if WTM_LOCAL_BG_DIAGNOSTICS`. Defining it
          # here — in the CI clone only, never committed — is what makes
          # `exportDiagnostics` exist at all. A production build has no such
          # condition, so that code is compiled OUT rather than merely unreachable.
          CONFIG=app/ios/Flutter/Release.xcconfig
          if ! grep -q "WTM_LOCAL_BG_DIAGNOSTICS" "$CONFIG"; then
            printf '\n// Injected by ios-internal-diagnostic. NEVER commit this line.\nSWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) WTM_LOCAL_BG_DIAGNOSTICS\n' >> "$CONFIG"
          fi
          cat "$CONFIG"
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd app
          BUILD_NUMBER_ARG=""
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)
            if [ -n "${LATEST:-}" ]; then
              BUILD_NUMBER_ARG="--build-number=$((LATEST + 1))"
              echo "Using TestFlight-derived build number: $((LATEST + 1))"
            fi
          fi
          flutter build ipa --release \
            --dart-define-from-file=env/prod.json \
            --export-options-plist=/Users/builder/export_options.plist \
            $BUILD_NUMBER_ARG
    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - app/env/prod.json
    publishing:
      app_store_connect:
        auth: integration
        # Upload ONLY — no `submit_to_testflight`, deliberately.
        #
        # `submit_to_testflight: true` submits to TestFlight BETA REVIEW, which is
        # required only for EXTERNAL testers. This build has diagnostics compiled in
        # and the iOS local-BG arm forced on; it must never reach an external group.
        # Measured: with it set, the upload and App Store Connect processing both
        # succeeded and then the workflow was marked failed by
        #   "Complete test information is required to submit application Wear The
        #    Mood build for external testing."
        # — a real build reported as a failure because it asked for a review it does
        # not need. Plain upload is sufficient: INTERNAL testers (App Store Connect
        # team users) can install a processed build with no review at all.
        submit_to_app_store: false
      email:
        recipients:
          - uprightseo24@gmail.com
