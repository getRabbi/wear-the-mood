# Gitleaks configuration.
#
# The scan runs with the DEFAULT ruleset and this file only narrows it. It exists
# because the default `generic-api-key` rule fires on our local-storage key NAMES:
#
#   static const _key = 'fashionos.drawers.v1';
#
# The rule keys off the identifier `_key` plus the string's entropy, and cannot
# tell a SharedPreferences bucket name from a credential. These values are not
# secrets in any sense -- they are namespaces for on-device storage, they are
# compiled into every published APK and IPA, and knowing one grants nothing.
#
# The allowlist below is deliberately narrow: it matches ONLY our own
# `fashionos.<name>` storage-namespace convention. It cannot mask an API key, a
# token, a private key or a connection string, none of which look like this.
#
# `useDefault = true` is what keeps every real rule active. Do not replace it with
# a hand-written ruleset -- that would silently drop detections nobody reviewed.

[extend]
useDefault = true

[allowlist]
description = """
Values that are PUBLIC BY DESIGN and ship inside the released app binaries.

Each entry is deliberately as narrow as it can be. Two are exact literals rather
than patterns, so this file cannot mask a different secret that happens to share a
shape -- in particular it does NOT allowlist the `jwt` rule, only one specific
already-public token. A Supabase service_role key, an API key, a private key or a
connection string would all still be caught.
"""
regexes = [
  # 1. On-device storage namespaces. The default `generic-api-key` rule fires on
  #    `static const _key = 'fashionos.drawers.v1'` because of the identifier
  #    `_key` plus entropy; it cannot tell a SharedPreferences bucket from a
  #    credential. Knowing one grants nothing.
  '''fashionos\.[a-z_]+(\.[a-z_]+)*(\.v[0-9]+)?''',

  # 2. The Supabase ANON / publishable key for the US project. Verified public:
  #    its decoded payload is {"iss":"supabase","ref":"ghzabbceoaoertatkjyg",
  #    "role":"anon"}. It is compiled into every APK and IPA by design, and
  #    CLAUDE.md §11 requires the anon key here and forbids the service-role key.
  #    Pinned to this exact token -- a service_role JWT would NOT match and would
  #    still fail the scan, which is the point.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoemFiYmNlb2FvZXJ0YXRranlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTg2OTAsImV4cCI6MjA5OTg3NDY5MH0\.wPLZkOEba_nl8dbWDlj7XDO1fE54A_iwyDC2E0k20ZU''',

  # 3. The Android OAuth client id. A client IDENTIFIER, not a secret: it is
  #    registered in the Google Cloud console, shipped in the app, and useless
  #    without the signing certificate it is bound to (docs/ANDROID_SIGNING_KEYS.md).
  '''939255107253-[a-z0-9]+''',

  # 4. One INVENTED test fixture: the fake idempotency key in the try-on timing
  #    tests (`test_timing.py`, `tryon_trace_test.dart`), which prove the trace
  #    token is a PREFIX of an idempotency key rather than the whole thing.
  #    `generic-api-key` fired on it because a bare 32-hex-char literal assigned
  #    to `key` looks like a credential. It never was one — nobody minted it, it
  #    authenticates nothing, and it appears only inside assertions.
  #
  #    HEAD no longer contains it: both tests now use the dashed uuid4 form the
  #    app actually mints, which does not trip the rule. This entry exists only
  #    because gitleaks scans FULL HISTORY (`git log -p --full-history --all`),
  #    so commit 380b40c would fail the scan forever otherwise — and rewriting a
  #    pushed branch to erase a string that was never secret is the worse trade.
  #
  #    Pinned to the exact literal, so it cannot mask anything else.
  '''ab12cd34ef567890abcdef1234567890''',

  # 5. Two more INVENTED try-on test fixtures, same class as #4 and same reason.
  #    `generic-api-key` fires on a dict entry keyed `"idempotency_key"` whose
  #    value has entropy — the rule reads the identifier, not the meaning. These
  #    two literals were never minted, authenticate nothing, and only ever fed
  #    `trace_token()` inside assertions.
  #
  #    HEAD contains neither: the fixture now uses the low-entropy "test-job",
  #    which does not trip the rule at all. They are pinned here only because
  #    gitleaks scans FULL HISTORY, so commits afa54aa and 56795eb would fail the
  #    scan forever otherwise — and rewriting pushed history to erase a string
  #    that was never secret is the worse trade, exactly as recorded in #4.
  #
  #    Pinned to the exact literals, so neither can mask anything else.
  '''abcdef01-2345-6789''',
  '''ab12cd34-ef56-7890-abcd-ef1234567890''',
]
