name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android-native:
    name: Android native (local-cutout engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      # The Kotlin suite is the ONLY coverage of the mask/cutout encoders and the ML
      # Kit confidence handling. Both have shipped broken while `flutter analyze` and
      # the whole Flutter suite stayed green, so this runs on every change, not just
      # at release time.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.fashionos.app.background.*"
        working-directory: app/android

  local-cutout-invariants:
    name: Local-cutout invariants (structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Catches at review time the regressions that used to be found in production:
      # a native source dropped from a build target, a plugin no longer registered,
      # a renamed channel, an unpinned ML Kit client, a removed endpoint, or a
      # committed feature policy that no longer states the production invariant.
      - run: python3 scripts/verify_local_cutout_release.py --target ci

  backend:
    name: FastAPI (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
