# Apply ordered SQL migrations to a deployed database.
#
# WHY THIS EXISTS
# ---------------
# `migration-deploy` releases the API dyno. Nothing in this repository applied
# SQL to a deployed database — that had only ever been done from a workstation
# holding the connection string in `backend/.env`. That is the one credential a
# workstation should not need to hold, and in practice the checked-in
# `backend/.env.prod` had already drifted to a Supabase project that is no
# longer production, so using it would have written to the wrong database.
#
# The DSN is therefore never stored here and never printed. It is read at run
# time from the Heroku config of the app being targeted — the same place the
# running API reads it from, which is what makes "the migration went to the
# database the API actually uses" true by construction rather than by trust.
#
# SAFETY PROPERTIES
#   * Gated by the `production` GitHub Environment (required reviewers), so a
#     human approves every run. Dispatching is not deploying.
#   * Applies ONLY files named in `files`, in the order given, one transaction
#     per file. It cannot run ad-hoc SQL.
#   * `dry_run` (the default) connects, resolves the DSN, and reports what WOULD
#     be applied without executing any of it.
#   * The DSN is masked with `::add-mask::` before it is used, so it cannot be
#     echoed into a log by a later step or an error trace.
#
# WHAT CHANGED AFTER THE BUILD-28 INCIDENT
# ----------------------------------------
# This workflow used to apply the files and then forget. There was no record of
# what any database had run, so `migration-deploy` could — and on 2026-08-21 did
# — release an API that depended on 0071 to a production database that had never
# applied it. Every background removal in that build failed, and no check in this
# repository was capable of noticing.
#
# It now runs through `backend/app/scripts/migrations.py`, which writes a row per
# applied file into `public.schema_migrations` IN THE SAME TRANSACTION as the SQL
# — so "the migration ran" and "we recorded that it ran" cannot disagree — and
# refuses to re-run a file whose checksum no longer matches what was applied.
# `migration-deploy` reads that ledger and will not promote a build without it.
name: migration-sql

on:
  workflow_dispatch:
    inputs:
      target:
        description: Heroku app whose database to migrate
        type: choice
        options: [staging, prod]
        default: staging
      mode:
        description: >-
          apply = run the named files. baseline = adopt an EXISTING database into
          the ledger, recording only what a schema probe proves is already there.
          status = migration ledger only. report = READ-ONLY release state:
          feature flags, monetization config, credit policy, consent counts and
          the wardrobe/category census. Writes nothing in either read mode.
        type: choice
        options: [apply, baseline, status, report]
        default: apply
      files:
        description: Space-separated migration filenames, in apply order (mode=apply)
        type: string
        required: false
        default: ""
      dry_run:
        description: Resolve and report only — apply nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apply:
    name: apply SQL to wtm-api-${{ inputs.target }}
    runs-on: ubuntu-latest
    # Same gate as migration-deploy, and for a stronger reason: this writes
    # schema. Also the only place HEROKU_API_KEY exists.
    environment: production
    env:
      APP: wtm-api-${{ inputs.target }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the migration runner's dependencies
        # psycopg for the connection; the runner itself only needs the stdlib
        # plus `app.core.schema_ledger`, which imports nothing heavier.
        run: pip install --quiet "psycopg[binary]"

      - name: Resolve the target DSN from Heroku config
        run: |
          set -euo pipefail
          # Heroku's config API, not the CLI: fewer moving parts and no login
          # state. jq is preinstalled on ubuntu-latest.
          DSN=$(curl -fsS "https://api.heroku.com/apps/$APP/config-vars" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            | jq -r '.CONNECTION_STRING_DIRECT // .CONNECTION_STRING // empty')
          if [ -z "$DSN" ]; then
            echo "::error::neither CONNECTION_STRING_DIRECT nor CONNECTION_STRING is set on $APP"
            exit 1
          fi
          # Mask FIRST, so nothing downstream can leak it — including a stack
          # trace from psycopg, which puts the DSN in its error text.
          echo "::add-mask::$DSN"
          echo "DSN=$DSN" >> "$GITHUB_ENV"
          echo "resolved a DSN for $APP"
          # The HOST is printed by the apply step, from the parsed connection
          # info. Deliberately not derived with shell string-slicing here: a
          # partial DSN echoed through `cut` is one masking miss away from
          # putting credentials in a public log.

      - name: Report what this database has already run
        working-directory: backend
        run: python -m app.scripts.migrations status || true
        env:
          MIGRATION_DSN: ${{ env.DSN }}

      - name: Apply migrations
        if: ${{ inputs.mode == 'apply' }}
        working-directory: backend
        run: |
          set -euo pipefail
          if [ -z "${FILES// }" ]; then
            echo '::error::mode=apply needs at least one filename in the files input'
            exit 1
          fi
          python -m app.scripts.migrations apply $FILES $APPLY_FLAG
        env:
          MIGRATION_DSN: ${{ env.DSN }}
          FILES: ${{ inputs.files }}
          # The runner reports unless told to execute, which is the same default
          # this workflow has always had — just enforced one layer lower down.
          APPLY_FLAG: ${{ inputs.dry_run && ' ' || '--apply' }}

      - name: Baseline an existing database from schema evidence
        if: ${{ inputs.mode == 'baseline' }}
        working-directory: backend
        # Records ONLY the versions whose probe confirms the change is already in
        # the schema, and marks them `baselined` so an inference is never mistaken
        # for a receipt. A required migration that is genuinely absent is reported
        # and left unrecorded — writing it would hard-code the exact lie that
        # caused the incident this whole mechanism exists to prevent.
        run: python -m app.scripts.migrations baseline --probe $APPLY_FLAG
        env:
          MIGRATION_DSN: ${{ env.DSN }}
          APPLY_FLAG: ${{ inputs.dry_run && ' ' || '--apply' }}

      - name: Read back the release state (read-only)
        if: ${{ inputs.mode == 'report' }}
        working-directory: backend
        # Two read-only reports, and neither can write: there is no --apply on
        # either script. `release_state` answers "is production configured the
        # way this build requires", which is a different question from "does it
        # have the schema" — and one that has been wrong before while the other
        # was right. `|| true` on the census so a non-zero verdict from the first
        # still lets the second print.
        run: |
          set -uo pipefail
          python -m app.scripts.release_state || RELEASE_STATE_FAILED=1
          echo
          python -m app.scripts.category_report || true
          exit "${RELEASE_STATE_FAILED:-0}"
        env:
          MIGRATION_DSN: ${{ env.DSN }}

      - name: Confirm the required schema is now in place
        if: ${{ !inputs.dry_run && inputs.mode != 'status' && inputs.mode != 'report' }}
        working-directory: backend
        run: python -m app.scripts.migrations preflight
        env:
          MIGRATION_DSN: ${{ env.DSN }}
