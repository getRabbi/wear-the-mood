# Heroku delivery for the migration API (blueprint §11.12).
# Heroku CANNOT pull the private GHCR package directly, so the SAME API artifact is
# rebuilt and pushed to the Heroku Container Registry, then released explicitly.
# BOTH targets are manual + gated by the `production` GitHub Environment
# (require-reviewers) — see the note on `environment:` below for why staging is
# not, and cannot be, gate-free. No production DNS is changed here (Phase 6).
name: migration-deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Heroku app to release
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

jobs:
  heroku:
    name: release wtm-api-${{ inputs.target }}
    runs-on: ubuntu-latest
    # BOTH targets use the protected `production` environment.
    #
    # Not a tightening for its own sake — it is the only place HEROKU_API_KEY and
    # HEROKU_EMAIL exist. Selecting no environment for staging (the old
    # `inputs.target == 'prod' && 'production' || ''`) resolved those secrets to
    # empty, so `docker login -u ""` failed and target=staging could never
    # authenticate. Every successful run of this workflow has been target=prod.
    #
    # Sharing the gate is also the honest arrangement: `wtm-api-staging` is
    # configured against the PRODUCTION Supabase project, so a staging release
    # runs new code against real user data and deserves the same review as prod.
    environment: production
    env:
      APP: wtm-api-${{ inputs.target }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # ── SCHEMA PREFLIGHT — the gate that did not exist on 2026-08-21 ────────
      #
      # On that day this workflow released an API depending on migration 0071 to
      # a production database that had never applied it. Background removal was
      # broken for every user of build 1.0.23+28, and nothing here could have
      # caught it: the job built an image, released it, and asked the schema
      # nothing at all.
      #
      # It now refuses to build until the target database can prove it has every
      # migration this backend requires. The proof is a read-only probe of the
      # schema itself (`app/core/schema_ledger.py`), not a ledger row — a row is
      # a claim, and the whole failure was a claim nobody checked.
      #
      # Deploy order is therefore enforced rather than remembered:
      #     migration-sql  →  migration-deploy (here)  →  client release
      #
      # If this step fails, the fix is to run `migration-sql` first. Do NOT
      # bypass it; a release that fails this preflight is a release that would
      # have shipped broken.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the preflight's dependencies
        run: pip install --quiet "psycopg[binary]"
      - name: Resolve the target DSN from Heroku config
        run: |
          set -euo pipefail
          DSN=$(curl -fsS "https://api.heroku.com/apps/$APP/config-vars"             -H "Accept: application/vnd.heroku+json; version=3"             -H "Authorization: Bearer $HEROKU_API_KEY"             | jq -r '.CONNECTION_STRING_DIRECT // .CONNECTION_STRING // empty')
          if [ -z "$DSN" ]; then
            echo "::error::neither CONNECTION_STRING_DIRECT nor CONNECTION_STRING is set on $APP"
            exit 1
          fi
          # Mask FIRST — psycopg puts the DSN in its own error text, so an
          # unmasked failure trace would publish the credential.
          echo "::add-mask::$DSN"
          echo "DSN=$DSN" >> "$GITHUB_ENV"
          echo "resolved a DSN for $APP"
      - name: Refuse to deploy ahead of the schema
        working-directory: backend
        run: python -m app.scripts.migrations preflight
        env:
          MIGRATION_DSN: ${{ env.DSN }}

      - name: Log in to the Heroku container registry
        run: echo "$HEROKU_API_KEY" | docker login registry.heroku.com -u "${{ secrets.HEROKU_EMAIL }}" --password-stdin
      - name: Build + push the API image to Heroku
        run: |
          docker build -f backend/api.Dockerfile -t registry.heroku.com/$APP/web backend
          docker push registry.heroku.com/$APP/web
      - name: Release (record the immutable image id)
        run: |
          IMAGE_ID=$(docker inspect registry.heroku.com/$APP/web --format={{.Id}})
          echo "Releasing $APP with image $IMAGE_ID"
          curl -fsS -X PATCH "https://api.heroku.com/apps/$APP/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}"
      # Stamp the deployed commit so /readyz reports the truth. Without this the
      # GIT_SHA config var goes stale and /readyz shows a commit the image does not
      # contain (observed after v5: field said 17a3a8c while the image was 0851595).
      # Runs AFTER the image release, so this config-var release restarts the dyno
      # on the NEW image — only the label changes, never a wrong-image window.
      # Short 7-char form to match the existing display convention.
      - name: Stamp GIT_SHA so /readyz reports the deployed commit
        run: |
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          echo "Setting GIT_SHA=$SHORT on $APP"
          curl -fsS -X PATCH "https://api.heroku.com/apps/$APP/config-vars" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"GIT_SHA\":\"$SHORT\"}"
