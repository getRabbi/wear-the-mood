# Static analysis configuration — https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Enforce "no stray dynamic" (CLAUDE.md §25).
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed / json_serializable place annotations the analyzer flags; harmless.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/**" # generated localizations (Step 5)
    # Build output is not source, and on a Mac it is not even OUR source:
    # Flutter's iOS SPM support checks the FlutterFire monorepo out into
    # build/ios/SourcePackages, and analysing its example and integration-test
    # code produced 11,992 errors referencing packages this app has never
    # depended on. `flutter analyze` therefore passed on Windows and on the
    # ubuntu CI runner — where build/ios does not exist — and failed only on
    # Codemagic, which is the one place an iOS release is actually cut.
    - "build/**"

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
